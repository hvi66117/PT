; Phong Than local 2026-09-29: layout for KUiTrade (player <-> player trade).
; UiTrade.ini was absent, so LoadScheme skipped Init (invisible window).
; Built on the VNG trade panel \Spr\Ui4\交易\交易.spr (260x400, title "Giao dich")
; using the VNG \ui\ui3 trade ini geometry, remapped to the sections
; KUiTrade::LoadScheme reads. Top 5x3 = other side, bottom 5x3 = own offer.
; Both players must use this same file: drop positions come from the matrix, so
; keeping 5x3 (a subset of the 10x4 core trade room) is safe.
; TakewithItemsBox (own bag, 6x10 = EQUIPMENT_ROOM) has no place on the VNG art;
; it floats to the right of the panel. DummyWnd=1 + Trans=1 are REQUIRED so that
; clicks on that out-of-image child still reach it (KWndImage::PtInWindow).
[Main]
Left=0
Top=116
Moveable=1
Trans=1
DummyWnd=1
Image=\Spr\Ui4\交易\交易.spr

;other player's name
[OtherName]
Left=30
Top=30
Width=200
Height=14
Font=14
HAlign=0
Color=218,255,165
BorderColor=23,68,0

;other player's offered items
[OtherItemsBox]
Left=26
Top=44
Width=205
Height=111
HUnits=5
VUnits=3
UnitBorder=2

;other player's offered money (the "Vang" box, text may run past the box)
[OtherMoney]
Left=44
Top=156
Width=120
Height=13
Font=12
HAlign=0
Color=218,255,165
BorderColor=0,0,0

;status line; the three *MsgColor keys are read by KUiTrade::LoadScheme
[InfoText]
Left=30
Top=174
Width=200
Height=28
Font=14
HAlign=0
MultiLine=1
Color=255,255,255
WaitTradeMsgColor=218,255,165
LockMsgColor=255,253,122
UnlockMsgColor=125,125,125

;own offered items
[SelfItemsBox]
Left=26
Top=202
Width=205
Height=111
HUnits=5
VUnits=3
UnitBorder=2

;own offered money (KWndEdit32, digits only)
[SelfMoney]
Left=44
Top=315
Width=50
Height=13
Font=12
Type=0
MultiLine=0
MaxLen=10
HAlign=0
Color=218,255,165
BorderColor=23,68,0

