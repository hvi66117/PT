; The VNG ui3 shop ini (list style ItemBox_0..13, BuyBtn1/SellBtn1) does not match
; KUiShop, which uses ONE KWndObjectMatrix: core packs goods into a 6x10 grid per
; page, column-major (CoreShell.cpp GDI_TRADE_NPC_ITEM + KInventory::FindRoom), so
; ItemBox must be HUnits=6 VUnits=10 or goods in rows 8-10 / col 6 are invisible.
; Icons are 32x32 painted unscaled at the cell origin (KBuySell::PaintItem), cells
; here are 40x30 so the 10 rows fit above the bottom bar (2px vertical overlap).
